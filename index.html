<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mweheheheh</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .question {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }

        .buttons {
            display: flex;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #f44336;
        }

        #noBtn:hover {
            background-color: #e53935;
        }
    </style>
</head>
<body>

    <div class="question">Mauki jadi pacarku???</div>
    <div class="buttons">
        <button id="yesBtn">iyye maujaa</button>
        <button id="noBtn">tidaaa mauuu</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Fungsi untuk memindahkan tombol "Tidak"
        function moveButton(button) {
            const randomX = Math.random() * (window.innerWidth - button.clientWidth);
            const randomY = Math.random() * (window.innerHeight - button.clientHeight);
            button.style.position = 'absolute';
            button.style.left = `${randomX}px`;
            button.style.top = `${randomY}px`;
        }

        noBtn.addEventListener('mouseover', () => moveButton(noBtn));

        yesBtn.addEventListener('click', () => {
            alert('yyeeyyyy kita pacaran hahahha');
            location.reload();
        });
    </script>

</body>
</html>
